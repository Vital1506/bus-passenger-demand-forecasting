services:
  - type: web
    name: bus-demand-forecast
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: BUS_FORECAST_REQUIRE_AUTH
        value: "true"
      - key: BUS_FORECAST_API_KEY
        generateValue: true
      - key: BUS_FORECAST_DATA_DIR
        value: /tmp/bus-forecast
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
