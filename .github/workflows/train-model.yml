name: Train forecasting model

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset to train and evaluate
        type: choice
        required: true
        default: mta
        options:
          - mta
          - sample
      route:
        description: MTA route to use when dataset is mta
        type: string
        required: true
        default: M15
  push:
    branches: [main]
    paths:
      - ".github/workflows/train-model.yml"
      - "src/**"
      - "data/sample_daily_ridership.csv"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  train-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Prepare selected dataset
        id: dataset
        shell: bash
        env:
          DATASET: ${{ inputs.dataset || 'sample' }}
          MTA_ROUTE: ${{ inputs.route || 'M15' }}
        run: |
          mkdir -p artifacts
          if [[ "$DATASET" == "mta" ]]; then
            python -m src.fetch_mta_daily --routes "$MTA_ROUTE" --output artifacts/mta_daily_ridership.csv
            echo "path=artifacts/mta_daily_ridership.csv" >> "$GITHUB_OUTPUT"
            echo "label=MTA Bus Hourly Ridership (official 2022–2024 historical dataset; route(s): $MTA_ROUTE)" >> "$GITHUB_OUTPUT"
            echo "missing_days=zero" >> "$GITHUB_OUTPUT"
            echo "is_public_mta=true" >> "$GITHUB_OUTPUT"
          elif [[ "$DATASET" == "sample" ]]; then
            echo "path=data/sample_daily_ridership.csv" >> "$GITHUB_OUTPUT"
            echo "label=Synthetic demo sample (not real-world evidence)" >> "$GITHUB_OUTPUT"
            echo "missing_days=error" >> "$GITHUB_OUTPUT"
            echo "is_public_mta=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported dataset: $DATASET" >&2
            exit 2
          fi
      - name: Train, backtest, and score final holdout
        run: >-
          python -m src.train
          --data "${{ steps.dataset.outputs.path }}"
          --model-out artifacts/model.joblib
          --horizon 7
          --folds 4
          --holdout-days 28
          --missing-days "${{ steps.dataset.outputs.missing_days }}"
          --metrics-out artifacts/backtest_metrics.json
          --predictions-out artifacts/backtest_predictions.csv
          --holdout-predictions-out artifacts/holdout_predictions.csv
      - name: Summarize validation and forecast errors
        shell: bash
        env:
          DATASET_LABEL: ${{ steps.dataset.outputs.label }}
          IS_PUBLIC_MTA: ${{ steps.dataset.outputs.is_public_mta }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import pandas as pd

          report = json.loads(Path("artifacts/backtest_metrics.json").read_text())
          model = report["model"]
          baseline = report["seasonal_naive"]
          holdout = report["final_holdout"]
          lines = [
              "## Model training and time-based evaluation",
              "",
              f"**Dataset:** {os.environ['DATASET_LABEL']}",
          ]
          if os.environ["IS_PUBLIC_MTA"] == "true":
              lines += [
                  "**Source:** [MTA Bus Hourly Ridership: 2020–2024](https://data.ny.gov/Transportation/MTA-Bus-Hourly-Ridership-2020-2024/kv7t-n8in).",
                  "Hourly estimates were summed across fare/payment categories by route and local service date. Source-absent route dates were explicitly filled as zero boardings for this run; verify that assumption against the service calendar before operational use.",
              ]
          else:
              lines += ["Synthetic sample results are demonstration evidence only and do not represent company or real-world performance."]
          lines += [
              "",
              f"- Model-selection CV: {report['backtest_folds']} expanding-window folds × {report['horizon_days']} days",
              f"- CV model WAPE: {model['wape']:.2%} | MAE: {model['mae']:.2f} | RMSE: {model['rmse']:.2f}",
              f"- CV seasonal-naive WAPE: {baseline['wape']:.2%} | MAE: {baseline['mae']:.2f} | RMSE: {baseline['rmse']:.2f}",
              "",
              f"### Final walk-forward holdout ({holdout['start']} to {holdout['end']})",
              "",
              f"Four sequential 7-day forecast blocks; actuals are revealed only after each block.",
              f"- Model WAPE: {holdout['model']['wape']:.2%} | MAE: {holdout['model']['mae']:.2f} | RMSE: {holdout['model']['rmse']:.2f}",
              f"- Seasonal-naive WAPE: {holdout['seasonal_naive']['wape']:.2%} | MAE: {holdout['seasonal_naive']['mae']:.2f} | RMSE: {holdout['seasonal_naive']['rmse']:.2f}",
              "",
              "### Holdout WAPE by route",
              "",
              "| Route | Model | Seasonal naive |",
              "|---|---:|---:|",
          ]
          for route, scores in holdout.get("by_route", {}).items():
              lines.append(f"| {route} | {scores['model']['wape']:.2%} | {scores['seasonal_naive']['wape']:.2%} |")

          lead = holdout["error_analysis"]["by_lead_day"]
          lines += [
              "",
              "### Holdout WAPE by forecast lead day",
              "",
              "| Lead day | Model WAPE |",
              "|---:|---:|",
          ]
          for day, scores in sorted(lead.items(), key=lambda item: int(item[0])):
              lines.append(f"| {day} | {scores['wape']:.2%} |")

          predictions = pd.read_csv("artifacts/holdout_predictions.csv")
          predictions["absolute_error"] = (predictions["passengers"] - predictions["predicted_passengers"]).abs()
          worst = predictions.nlargest(5, "absolute_error")
          lines += [
              "",
              "### Largest holdout misses",
              "",
              "| Date | Route | Actual | Forecast | Absolute error | Lead day |",
              "|---|---|---:|---:|---:|---:|",
          ]
          for row in worst.itertuples(index=False):
              lines.append(
                  f"| {row.service_date} | {row.route_id} | {row.passengers:.0f} | "
                  f"{row.predicted_passengers:.1f} | {row.absolute_error:.1f} | {row.lead_day} |"
              )
          lines += [
              "",
              "The downloadable artifact includes the fitted full-history model, data/source metadata, model-selection predictions, final holdout predictions, and error analysis.",
          ]
          with open(Path(os.environ["GITHUB_STEP_SUMMARY"]), "a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Upload trained model, data, and evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bus-demand-model-and-backtest
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
