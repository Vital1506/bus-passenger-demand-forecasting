name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "data/sample_daily_ridership.csv"
      - "desktop_launcher.py"
      - "requirements*.txt"
      - ".github/workflows/build-app.yml"

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Install desktop build dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Package Windows app
        shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name BusDemandForecast --paths .
          --add-data "web;web"
          --add-data "data/sample_daily_ridership.csv;data"
          --collect-all sklearn --collect-all pandas --collect-all numpy
          --collect-all joblib --collect-all uvicorn --collect-all webview
          desktop_launcher.py
      - name: Zip installable app folder
        shell: pwsh
        run: Compress-Archive -Path dist/BusDemandForecast -DestinationPath BusDemandForecast-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BusDemandForecast-Windows
          path: BusDemandForecast-Windows.zip
          if-no-files-found: error
          retention-days: 30
